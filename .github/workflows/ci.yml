
name: VoxSense AI - Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python and Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run Python unit and API tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/e2e \
            --ignore=tests/test_model_inference.py

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Start Flask application
        run: |
          nohup python -m backend.app > flask.log 2>&1 &

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:5002/api/health; then
              echo "Flask is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Flask did not start."
          cat flask.log
          exit 1

      - name: Run Playwright end-to-end tests
        run: |
          python -m pytest tests/e2e/ -v \
            --browser chromium

      - name: Show Flask logs on failure
        if: failure()
        run: |
          if [ -f flask.log ]; then
            cat flask.log
          fi
